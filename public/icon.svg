<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#041e2a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="8"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#083344" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.4"/>

  <!-- Center Hexagon / POCO Engine Symbol -->
  <polygon points="256,160 336,208 336,304 256,352 176,304 176,208" fill="#031826" stroke="url(#neonCyan)" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Play/Engine Core Triangle -->
  <polygon points="236,216 296,256 236,296" fill="url(#neonCyan)"/>
  
  <!-- Speed lines -->
  <path d="M 120 256 L 150 256" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  <path d="M 362 256 L 392 256" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Badge label text -->
  <text x="256" y="416" fill="#22d3ee" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="4">POCO 90FPS</text>
  <text x="256" y="448" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">WALLPAPER ENGINE</text>
</svg>
